name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-windows.txt
      - name: Install CPU runtime
        run: python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Install application and builder
        run: python -m pip install -r packaging/requirements-windows.txt -e .
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Create synthetic speech fixture
        shell: powershell
        run: ./scripts/create_test_audio.ps1
      - name: Build and test frozen application
        run: python scripts/build_windows.py
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-diagnostics
          path: |
            dist/VoiceCaption/self-test.json
            dist/VoiceCaption/integration-test.json
            dist/VoiceCaption/build-dependencies.txt
            build/VoiceCaption/warn-VoiceCaption.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: VoiceCaption-windows-x64
          path: |
            release/*-windows-x64.zip
            release/*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
