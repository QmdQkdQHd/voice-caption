[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-caption"
version = "0.2.0"
description = "CPU-first local translated captions for Windows games and Discord"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.7,<6.9", "numpy>=1.26,<2", "scipy>=1.12,<2",
  "SoundCard>=0.4.3,<0.5", "faster-whisper>=1.1,<2",
  "argostranslate>=1.9,<2", "mss>=9,<11", "Pillow>=10,<12",
  "pytesseract>=0.3.13,<0.4",
]

[project.scripts]
voice-caption = "voice_caption.app:main"
voice-caption-models = "voice_caption.models:main"

[tool.setuptools.packages.find]
include = ["voice_caption*"]
